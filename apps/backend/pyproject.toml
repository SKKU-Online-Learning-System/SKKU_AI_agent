[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skku-course-agent-backend"
version = "0.1.0"
description = "FastAPI backend for the SKKU Course Agent MVP."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "anthropic>=0.69,<1",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "pypdf>=5.0,<7",
  "psycopg[binary]>=3.2,<4",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.9,<1",
  "python-pptx>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<17"
]

[project.optional-dependencies]
parsers = [
  "python-docx>=1.1",
  "python-pptx>=0.6"
]
# COURSE AGENT extra: optional Moss memory plus application-side CPU Silero VAD.
# Pin torch and torchaudio directly so uv applies the explicit CPU-only source
# even though Silero also declares them transitively. No CUDA packages belong here.
voice = [
  "moss>=1.7.1,<2",
  "silero-vad[onnx-cpu]==6.2.1",
  "torch==2.9.1",
  "torchaudio==2.9.1"
]
# Legacy deterministic endpointing tests/comparison only; local_cascade uses Silero.
vad = [
  "webrtcvad-wheels>=2.0.14,<3"
]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "ruff>=0.15,<0.16",
  "types-python-jose>=3.5,<4"
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
