[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skku-course-agent-backend"
version = "0.1.0"
description = "FastAPI backend for the SKKU Course Agent MVP."
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "pypdf>=5.0,<7",
  "psycopg[binary]>=3.2,<4",
<<<<<<< HEAD
  "pypdf>=4.0",
=======
  "python-docx>=1.1,<2",
>>>>>>> refs/remotes/origin/main
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.9,<1",
  "python-pptx>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
parsers = [
  "python-docx>=1.1",
  "python-pptx>=0.6"
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "ruff>=0.15,<0.16",
  "types-python-jose>=3.5,<4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
