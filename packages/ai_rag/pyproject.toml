[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skku-ai-rag"
version = "0.1.0"
description = "AI/RAG module for course-scoped retrieval and answer generation."
requires-python = ">=3.9"
dependencies = [
  "anthropic>=0.69,<1",
  "pydantic>=2.8,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.15,<0.16"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skku_ai_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
