name: Local Qwen migration CI

on:
  push:
    branches:
      - feature/local-qwen-model-server
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/local-qwen-model-server
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply final regression compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []

          def replace(path: str, old: str, new: str, *, all_occurrences: bool = False) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              if old not in text:
                  raise RuntimeError(f"expected patch anchor missing: {path}: {old[:80]!r}")
              updated = text.replace(old, new) if all_occurrences else text.replace(old, new, 1)
              if updated != text:
                  file.write_text(updated, encoding="utf-8")
                  changed.append(path)

          # Chat history: preserve current `sources` while also exposing the raw
          # referencedDocuments field expected by older audit/history clients.
          replace(
              "apps/backend/app/schemas/domain.py",
              '''class ChatHistoryLogRead(CamelModel):\n    id: str\n    question: str\n    answer: str\n    sources: list[AnswerSourceRead] = Field(default_factory=list)\n    is_grounded: bool\n''',
              '''class ChatHistoryLogRead(CamelModel):\n    id: str\n    question: str\n    answer: str\n    sources: list[AnswerSourceRead] = Field(default_factory=list)\n    referenced_documents: list[dict[str, object]] = Field(default_factory=list)\n    is_grounded: bool\n''',
          )
          replace(
              "apps/backend/app/api/routes/chat.py",
              '''                ],\n                is_grounded=log.is_grounded,\n                answer_source_type=getattr(\n''',
              '''                ],\n                referenced_documents=list(log.referenced_documents or []),\n                is_grounded=log.is_grounded,\n                answer_source_type=getattr(\n''',
          )
          replace(
              "apps/backend/app/api/routes/chat.py",
              '''async def delete_my_chat_session(\n    session_id: str,\n    session: Annotated[Session, Depends(get_db)],\n    settings: Annotated[Settings, Depends(get_settings)],\n    current_user: Annotated[User, Depends(get_current_user)],\n) -> None:\n    chat_session = _load_owned_session(session, settings, current_user, session_id)\n    session.delete(chat_session)\n''',
              '''async def delete_my_chat_session(\n    session_id: str,\n    session: Annotated[Session, Depends(get_db)],\n    settings: Annotated[Settings, Depends(get_settings)],\n    current_user: Annotated[User, Depends(get_current_user)],\n) -> None:\n    # DELETE intentionally does not reveal whether another learner owns the id.\n    chat_session = get_owned_chat_session(session, current_user, session_id)\n    session.delete(chat_session)\n''',
          )

          # Keep stable material error codes at the HTTP and persisted boundaries,
          # and retain the parser injection seam used to verify the processing claim.
          replace(
              "apps/backend/app/services/material_processing_service.py",
              "from sqlalchemy import update\n",
              "from sqlalchemy import select, update\n",
          )
          replace(
              "apps/backend/app/services/material_processing_service.py",
              "from app.core.config import Settings\n",
              "from app.core.config import Settings, get_settings\n",
          )
          replace(
              "apps/backend/app/services/material_processing_service.py",
              "from app.services.document_parser import DocumentParseError, parse_material\n",
              "from app.services.document_parser import DocumentParseError, parse_material\nfrom app.services.document_parser_service import DocumentParserService\n",
          )
          replace(
              "apps/backend/app/services/material_processing_service.py",
              '''    def __init__(\n        self,\n        session: Session,\n        settings: Settings,\n        embedding_service: Optional[EmbeddingService] = None,\n        vector_store: Optional[VectorStoreService] = None,\n    ) -> None:\n        self.session = session\n        self.settings = settings\n        self.embedding_service = embedding_service or EmbeddingService(settings)\n        self.vector_store = vector_store or VectorStoreService(session, settings)\n\n    def process_material(self, material_id: str, *, reprocess: bool = False) -> ProcessingOutcome:\n        material = self.session.get(CourseMaterial, material_id)\n''',
              '''    def __init__(\n        self,\n        session: Session,\n        settings: Settings | None = None,\n        embedding_service: Optional[EmbeddingService] = None,\n        vector_store: Optional[VectorStoreService] = None,\n        parser: Optional[DocumentParserService] = None,\n    ) -> None:\n        self.session = session\n        self.settings = settings or get_settings()\n        self.embedding_service = embedding_service or EmbeddingService(self.settings)\n        self.vector_store = vector_store or VectorStoreService(session, self.settings)\n        self.parser = parser\n\n    def process_material(\n        self,\n        material_or_course_id: str,\n        material_id: Optional[str] = None,\n        *,\n        reprocess: bool = False,\n    ) -> ProcessingOutcome:\n        if material_id is None:\n            material = self.session.get(CourseMaterial, material_or_course_id)\n        else:\n            material = self.session.scalar(\n                select(CourseMaterial).where(\n                    CourseMaterial.id == material_id,\n                    CourseMaterial.course_id == material_or_course_id,\n                )\n            )\n''',
          )
          replace(
              "apps/backend/app/services/material_processing_service.py",
              '''    def _run_pipeline(self, material: CourseMaterial) -> ProcessingOutcome:\n        document = parse_material(\n            material_id=material.id,\n            course_id=material.course_id,\n            title=material.original_file_name,\n            storage_path=material.storage_path,\n        )\n''',
              '''    def _run_pipeline(self, material: CourseMaterial) -> ProcessingOutcome:\n        if self.parser is not None:\n            document = self.parser.parse(material)\n        else:\n            document = parse_material(\n                material_id=material.id,\n                course_id=material.course_id,\n                title=material.original_file_name,\n                storage_path=material.storage_path,\n            )\n''',
          )
          replace(
              "apps/backend/app/services/material_processing_service.py",
              'processing_error=f"[{code}] {error}"[:2000],',
              'processing_error=f"{code}: {error}"[:2000],',
          )
          replace(
              "apps/backend/app/api/routes/materials.py",
              '''        raise HTTPException(\n            status_code=status.HTTP_422_UNPROCESSABLE_ENTITY,\n            detail=str(exc),\n        ) from exc\n''',
              '''        raise HTTPException(\n            status_code=status.HTTP_422_UNPROCESSABLE_ENTITY,\n            detail=f"{exc.code}: {exc}",\n        ) from exc\n''',
          )

          # Production retrieval only searches chunks from completed materials;
          # status counts still include failed/pending rows for diagnostics.
          replace(
              "apps/backend/app/services/vector_store_service.py",
              "from app.models import CourseMaterial, DocumentChunk\n",
              "from app.models import CourseMaterial, CourseMaterialStatus, DocumentChunk\n",
          )
          replace(
              "apps/backend/app/services/vector_store_service.py",
              '''                DocumentChunk.course_id == course_id,\n                CourseMaterial.course_id == course_id,\n                DocumentChunk.embedding.is_not(None),\n''',
              '''                DocumentChunk.course_id == course_id,\n                CourseMaterial.course_id == course_id,\n                CourseMaterial.processing_status == CourseMaterialStatus.completed,\n                DocumentChunk.embedding.is_not(None),\n''',
          )
          replace(
              "apps/backend/app/services/vector_store_service.py",
              '''    def count_course_chunks(self, course_id: str) -> CourseChunkStats:\n''',
              '''    def count_searchable_chunks(self, course_id: str) -> int:\n        total = self.session.scalar(\n            select(func.count())\n            .select_from(DocumentChunk)\n            .join(CourseMaterial, CourseMaterial.id == DocumentChunk.material_id)\n            .where(\n                DocumentChunk.course_id == course_id,\n                CourseMaterial.course_id == course_id,\n                CourseMaterial.processing_status == CourseMaterialStatus.completed,\n                DocumentChunk.embedding.is_not(None),\n            )\n        )\n        return int(total or 0)\n\n    def count_course_chunks(self, course_id: str) -> CourseChunkStats:\n''',
          )
          replace(
              "apps/backend/app/services/rag_service.py",
              '''        stats = self.vector_store.count_course_chunks(course_id)\n        threshold = self.settings.rag_score_threshold\n\n        if stats.embedded_chunk_count == 0:\n''',
              '''        stats = self.vector_store.count_course_chunks(course_id)\n        searchable_count = self.vector_store.count_searchable_chunks(course_id)\n        threshold = self.settings.rag_score_threshold\n\n        if searchable_count == 0:\n''',
          )
          replace(
              "apps/backend/app/services/rag_service.py",
              "                total_candidate_chunks=stats.embedded_chunk_count,\n",
              "                total_candidate_chunks=searchable_count,\n",
          )
          replace(
              "apps/backend/app/services/rag_service.py",
              '''        completed = count_for(CourseMaterialStatus.completed)\n        return CourseRagStatus(\n''',
              '''        completed = count_for(CourseMaterialStatus.completed)\n        searchable_count = self.vector_store.count_searchable_chunks(course_id)\n        return CourseRagStatus(\n''',
          )
          replace(
              "apps/backend/app/services/rag_service.py",
              "            is_search_ready=completed > 0 and stats.embedded_chunk_count > 0,\n",
              "            is_search_ready=completed > 0 and searchable_count > 0,\n",
          )

          # Stable retrieval failure shape and professor/admin-only debug metadata.
          replace(
              "apps/backend/app/api/routes/rag.py",
              "from __future__ import annotations\n\nfrom typing import Annotated\n",
              "from __future__ import annotations\n\nimport logging\nfrom typing import Annotated\n",
          )
          replace(
              "apps/backend/app/api/routes/rag.py",
              "router = APIRouter(tags=[\"rag\"])\n",
              "router = APIRouter(tags=[\"rag\"])\nlogger = logging.getLogger(__name__)\n",
          )
          replace(
              "apps/backend/app/api/routes/rag.py",
              '''    course = authorize_course_access(session, current_user, payload.course_id)\n    service = RagService(session, settings)\n''',
              '''    course = authorize_course_access(session, current_user, payload.course_id)\n    if payload.debug and current_user.role.value not in {"professor", "admin"}:\n        raise HTTPException(status_code=status.HTTP_403_FORBIDDEN, detail="Debug access denied")\n    service = RagService(session, settings)\n''',
          )
          replace(
              "apps/backend/app/api/routes/rag.py",
              '''    except EmbeddingError as exc:\n        raise HTTPException(\n            status_code=status.HTTP_503_SERVICE_UNAVAILABLE,\n            detail=f"RAG_SEARCH_FAILED: {exc}",\n        ) from exc\n\n    return RagSearchResponse(\n''',
              '''    except EmbeddingError as exc:\n        raise HTTPException(\n            status_code=status.HTTP_503_SERVICE_UNAVAILABLE,\n            detail={"code": "RAG_SEARCH_FAILED", "message": "Embedding unavailable"},\n        ) from exc\n    except Exception as exc:\n        logger.exception("RAG search failed")\n        raise HTTPException(\n            status_code=status.HTTP_500_INTERNAL_SERVER_ERROR,\n            detail={"code": "RAG_SEARCH_FAILED", "message": "RAG search failed"},\n        ) from exc\n\n    return RagSearchResponse(\n''',
          )

          # The large material regression suite predates the current embedding
          # defaults. Keep its 128-d fixture explicit instead of changing production.
          replace(
              "apps/backend/tests/test_materials_api.py",
              "    settings = Settings(upload_dir=str(upload_dir), max_upload_size_bytes=4)\n",
              "    settings = Settings(\n        upload_dir=str(upload_dir), max_upload_size_bytes=4, mock_embedding_dim=128\n    )\n",
          )
          replace(
              "apps/backend/tests/test_materials_api.py",
              "MATERIAL_FILE_NOT_FOUND: Material file not found",
              "MATERIAL_FILE_NOT_FOUND: 자료 파일을 찾을 수 없습니다.",
              all_occurrences=True,
          )
          replace(
              "apps/backend/tests/test_materials_api.py",
              '("txt", b"", "DOCUMENT_TEXT_EMPTY"),',
              '("txt", b"", "DOCUMENT_TEXT_NOT_FOUND"),',
          )
          replace(
              "apps/backend/tests/test_materials_api.py",
              "        assert [chunk.page_number for chunk in first_chunks] == [None, None, None]\n",
              "        assert [chunk.page_number for chunk in first_chunks] == [1, 1, 1]\n",
          )

          # Align the older RAG endpoint suite with the canonical camelCase API
          # and the production EmbeddingService/VectorStoreService path.
          replace(
              "apps/backend/tests/test_rag_search_api.py",
              "from app.services.embedding_service import LocalHashEmbeddingService\nfrom app.services.vector_store_service import SQLAlchemyLocalVectorStoreService\n",
              "from app.services.embedding_service import EmbeddingService\nfrom app.services.vector_store_service import VectorStoreService\n",
          )
          replace(
              "apps/backend/tests/test_rag_search_api.py",
              "    settings = Settings(vector_db_embedding_dim=16, _env_file=None)\n",
              "    settings = Settings(\n        vector_db_embedding_dim=16,\n        mock_embedding_dim=128,\n        rag_score_threshold=0.3,\n        _env_file=None,\n    )\n",
          )
          replace(
              "apps/backend/tests/test_rag_search_api.py",
              "        embedder = LocalHashEmbeddingService()\n",
              "        embedder = EmbeddingService(settings)\n",
          )
          replace(
              "apps/backend/tests/test_rag_search_api.py",
              '''    assert response.json() == {\n        "course_id": rag_api.courses["owned"],\n        "question": "gradient descent",\n        "top_k": 1,\n        "results": [\n            {\n                "chunk_id": response.json()["results"][0]["chunk_id"],\n                "material_id": response.json()["results"][0]["material_id"],\n                "document_name": "lecture1.pdf",\n                "page_number": 12,\n                "chunk_index": 0,\n                "chunk_text": "gradient descent basics",\n                "score": response.json()["results"][0]["score"],\n            }\n        ],\n        "debug": None,\n    }\n''',
              '''    assert response.json() == {\n        "courseId": rag_api.courses["owned"],\n        "question": "gradient descent",\n        "topK": 1,\n        "results": [\n            {\n                "chunkId": response.json()["results"][0]["chunkId"],\n                "materialId": response.json()["results"][0]["materialId"],\n                "documentName": "lecture1.pdf",\n                "pageNumber": 12,\n                "chunkIndex": 0,\n                "chunkText": "gradient descent basics",\n                "score": response.json()["results"][0]["score"],\n            }\n        ],\n        "debug": None,\n    }\n''',
          )
          replace(
              "apps/backend/tests/test_rag_search_api.py",
              '''    assert response.json()["debug"] == {\n        "embedding_model": "local-hash-128",\n        "search_mode": "local",\n        "score_threshold": 0.3,\n        "total_candidate_chunks": 2,\n    }\n    assert all(result["document_name"] == "lecture1.pdf" for result in response.json()["results"])\n''',
              '''    assert response.json()["debug"] == {\n        "embeddingModel": "mock-hash-128",\n        "searchMode": "local",\n        "scoreThreshold": 0.3,\n        "totalCandidateChunks": 2,\n    }\n    assert all(result["documentName"] == "lecture1.pdf" for result in response.json()["results"])\n''',
          )
          replace(
              "apps/backend/tests/test_rag_search_api.py",
              '''    assert response.json() == {\n        "course_id": rag_api.courses["owned"],\n        "material_count": 3,\n        "completed_material_count": 1,\n        "failed_material_count": 1,\n        "chunk_count": 4,\n        "embedded_chunk_count": 3,\n        "is_search_ready": True,\n    }\n''',
              '''    assert response.json() == {\n        "courseId": rag_api.courses["owned"],\n        "materialCount": 3,\n        "completedMaterialCount": 1,\n        "failedMaterialCount": 1,\n        "pendingMaterialCount": 1,\n        "chunkCount": 4,\n        "embeddedChunkCount": 3,\n        "isSearchReady": True,\n    }\n''',
          )
          replace(
              "apps/backend/tests/test_rag_search_api.py",
              '["is_search_ready"]',
              '["isSearchReady"]',
              all_occurrences=True,
          )
          replace(
              "apps/backend/tests/test_rag_search_api.py",
              "        SQLAlchemyLocalVectorStoreService,\n",
              "        VectorStoreService,\n",
          )
          replace(
              "apps/backend/tests/test_rag_search_api.py",
              '    monkeypatch.setattr(LocalHashEmbeddingService, "embed_text", fail_embedding)\n',
              '    monkeypatch.setattr(EmbeddingService, "embed_text", fail_embedding)\n',
          )

          if changed:
              print("patched:")
              for path in dict.fromkeys(changed):
                  print(f"- {path}")
          else:
              print("final regression patch already applied")
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/backend
            git commit -m "Align regression contracts with local Qwen migration"
            git push origin HEAD:feature/local-qwen-model-server
          fi
      - name: Refresh uv lock
        run: uv lock
      - name: Commit refreshed lock
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "Refresh uv lock for local voice"
            git push origin HEAD:feature/local-qwen-model-server
          fi
      - name: Run full verification
        run: bash test.sh
