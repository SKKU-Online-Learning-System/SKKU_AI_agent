name: Local Qwen migration CI

on:
  push:
    branches:
      - feature/local-qwen-model-server
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate Backend.AI launch scripts
        run: bash -n run_backendai.sh stop_backendai.sh healthcheck_backendai.sh
      - name: Install frontend dependencies
        run: npm ci
      - name: Run full verification
        run: bash test.sh
